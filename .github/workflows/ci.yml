name: CI

on:
  push:
    branches: [main]
  pull_request:

# 📝 Lightweight by design: the JVM unit tests only need a JDK and the Kotlin
# compiler, so CI finishes in a couple of minutes and stays well inside the
# GitHub Free minutes budget. The APK build itself is a local, one-command
# script (build.sh) run by the maintainer, so it is not part of CI.
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin compiler 2.0.21
        run: |
          curl -sfL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlin.zip -d /tmp
          echo "/tmp/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run unit tests
        run: ./tests/run-tests.sh
